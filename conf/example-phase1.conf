# Example configuration with Phase 1 features
# This demonstrates user mirroring and network configuration

REPOSITORY=kruskakli/my-debian
TAG=v5
NAME=dev-example
HOSTNAME=devbox

# Shared directory (required)
SHARED_DIR=/tmp/shared_docker_dir

# Port mappings
PORTS=9080:8080
EXTRA_RUN_FLAGS="-p 9008:8008 -p 4008:4000"

# ========================================
# User Mirroring Configuration (Phase 1)
# ========================================
# Enable automatic user mirroring to match host user
MIRROR_USER=yes

# Optional: Specify user to mirror (defaults to current user)
# MIRROR_USER_NAME=tobbe
# MIRROR_USER_UID=1000
# MIRROR_USER_GID=1000

# Directories to mount with matching paths
# Syntax: "path" or "path:ro" for read-only
MIRROR_DIRS=(
  "/home/tobbe/work/git/trunk"
  "/home/tobbe/projects/myapp"
  "/home/tobbe/.gitconfig:ro"
  "/home/tobbe/.ssh:ro"
)

# ========================================
# Network Configuration (Phase 1)
# ========================================
# Network to connect container to
NETWORK_NAME=dev_network

# Network driver (bridge, overlay, host, etc.)
NETWORK_DRIVER=bridge

# Auto-create network if it doesn't exist
NETWORK_CREATE_IF_MISSING=yes

# Optional: Network subnet and gateway
# NETWORK_SUBNET=172.18.0.0/16
# NETWORK_GATEWAY=172.18.0.1

# Optional: Internal network (no external connectivity)
# NETWORK_INTERNAL=no
